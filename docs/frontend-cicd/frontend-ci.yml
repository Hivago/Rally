# Frontend CI — drop into each frontend repo at: .github/workflows/ci.yml
#
# Runs on every PR to the production branch and blocks the merge unless
# typecheck + lint + build all pass. After the first run, add the "verify"
# job as a REQUIRED status check in branch protection.
#
# Assumes npm. If the repo uses pnpm or yarn, see the notes at the bottom.

name: Frontend CI

on:
  pull_request:
    branches: [main, master, production, staging]
  push:
    branches: [main, master, production, staging]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TypeScript must compile with no errors (react-rules.md: no `any`, strict mode).
      - name: Type check
        run: npm run typecheck

      # Lint must pass (no console.log, no inline styles, etc.).
      - name: Lint
        run: npm run lint

      # The app must actually build. This is the real gate against a broken deploy.
      - name: Build
        run: npm run build

# ---------------------------------------------------------------------------
# Package-manager variants:
#
# pnpm:
#   - name: Setup pnpm
#     uses: pnpm/action-setup@v4
#     with: { version: 9 }
#   - uses: actions/setup-node@v4
#     with: { node-version: '20', cache: 'pnpm' }
#   - run: pnpm install --frozen-lockfile
#   - run: pnpm typecheck && pnpm lint && pnpm build
#
# yarn:
#   - uses: actions/setup-node@v4
#     with: { node-version: '20', cache: 'yarn' }
#   - run: yarn install --frozen-lockfile
#   - run: yarn typecheck && yarn lint && yarn build
#
# If the repo has no "typecheck" script, add this to package.json scripts:
#   "typecheck": "tsc --noEmit"
# ---------------------------------------------------------------------------
