name: Rally CI

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop, staging]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/Modules/Orders/RallyAPI.Orders.Domain.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test tests/Modules/Orders/RallyAPI.Orders.Application.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test tests/Modules/Delivery/RallyAPI.Delivery.Application.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test tests/Modules/Pricing/RallyAPI.Pricing.Application.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test tests/Modules/Users/RallyAPI.Users.Infrastructure.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test tests/Modules/Marketing/RallyAPI.Marketing.Application.Tests/ --no-build --configuration Release --verbosity normal
          dotnet test RallyAPI.Integrations.ProRouting.Tests/ --no-build --configuration Release --verbosity normal

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_CI_WEBHOOK_URL secret not set — skipping notification."
            exit 0
          fi
          payload=$(jq -n \
            --arg desc "[$GITHUB_REF_NAME] $GITHUB_ACTOR — build-and-test failed" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: "Rally CI failed", description: $desc, url: $url, color: 15158332}]}')
          curl -sf -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test tests/RallyAPI.Integration.Tests/ --no-build --configuration Release --verbosity normal

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_CI_WEBHOOK_URL secret not set — skipping notification."
            exit 0
          fi
          payload=$(jq -n \
            --arg desc "[$GITHUB_REF_NAME] $GITHUB_ACTOR — integration-tests failed" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: "Rally CI failed", description: $desc, url: $url, color: 15158332}]}')
          curl -sf -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
